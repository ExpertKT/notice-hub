<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群务台</title><style>
:root{font-family: sans-serif;color:#18332e;background:#f4f6f5}*{box-sizing:border-box}body{margin:0;background:#f4f6f5;font-size:16px}.app{max-width:760px;margin:auto;padding:20px 16px 88px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:28px;font-weight:700;color:#0f6b5c}.state{font-size:14px;color:#0f6b5c}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#27a66f;margin-right:5px}.offline{background:#e38b37}.banner{margin:14px 0;padding:12px;border-radius:8px;background:#fff0d8;color:#935719}.overview{margin-top:20px}.headline{font-size:22px;font-weight:700}.subline{margin-top:5px;color:#63736f}.stats{display:flex;gap:10px;margin-top:14px}.stat{flex:1;background:#fff;border:1px solid #dce5e2;border-radius:12px;padding:12px}.stat b{display:block;font-size:26px;color:#0f6b5c}.stat span{font-size:13px;color:#63736f}.section{margin-top:24px}.section h2{font-size:19px;margin:0 0 10px}.card{position:relative;background:#fff;border:1px solid #dce5e2;border-radius:12px;padding:14px 14px 13px 17px;margin:9px 0}.urgent{border-left:3px solid #e46d3c;padding-left:14px}.summary{font-size:18px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta,.details{font-size:13px;color:#65746f;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:24px 8px;text-align:center;color:#71807b}.refresh{position:fixed;right:20px;bottom:22px;border:0;border-radius:50%;width:56px;height:56px;background:#0f6b5c;color:#fff;font-size:25px;box-shadow:0 3px 12px #789}
</style></head><body><main class="app"><header class="top"><div class="brand">群务台</div><div class="state"><i class="dot" id="dot"></i><span id="state">在线</span><span id="updated"></span></div></header><div id="banner"></div><section class="overview"><div id="headline" class="headline">待办</div><div id="subline" class="subline"></div><div class="stats"><div class="stat"><b id="open">0</b><span>未完成</span></div><div class="stat"><b id="overdue">0</b><span>逾期</span></div><div class="stat"><b id="done">0</b><span>已完成</span></div></div></section><div id="lists"></div></main><button class="refresh" aria-label="刷新" onclick="if(window.AndroidBridge)AndroidBridge.refresh()">↻</button><script>
(function(){
function arr(x){return Array.isArray(x)?x:[]} function text(x){return x==null?'':String(x)}
function dateText(x){if(!x)return '';var d=new Date(x);if(isNaN(d.getTime()))return '';return '截止 '+(d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function card(t){var el=document.createElement('article');el.className='card'+(Number(t.importance)>=3||t.urgent?' urgent':'');var a=document.createElement('div');a.className='summary';a.textContent=text(t.summary)||'未命名任务';el.appendChild(a);var m=document.createElement('div');m.className='meta';m.textContent=[dateText(t.deadline),arr(t.groups).join('、')].filter(Boolean).join(' · ');if(m.textContent)el.appendChild(m);if(t.details){var q=document.createElement('div');q.className='details';q.textContent=text(t.details);el.appendChild(q)}return el}
window.NH_render=function(p){p=p||{};var t=p.tasks||{},m=p.meta||{},st=t.stats||m.stats||{};document.getElementById('headline').textContent=text(t.headline)||'待办';document.getElementById('subline').textContent=text(t.subline);document.getElementById('open').textContent=text(st.open)||'0';document.getElementById('overdue').textContent=text(st.overdue)||'0';document.getElementById('done').textContent=text(st.done)||'0';var off=p.offline===true;document.getElementById('state').textContent=off?'离线':'在线';document.getElementById('dot').className='dot'+(off?' offline':'');document.getElementById('updated').textContent=p.fetchedAt?' · 更新于 '+text(p.fetchedAt).substring(11,16):'';var b=document.getElementById('banner');b.textContent=off?'现在连不上电脑，这是上次同步的数据':'';var root=document.getElementById('lists');root.textContent='';var seen={};[['today','今天'],['pinned','置顶'],['week','本周'],['later','以后']].forEach(function(g){var list=arr(t[g[0]]).filter(function(x){if(!x||x.id==null||seen[x.id])return false;seen[x.id]=true;return true});if(!list.length)return;var s=document.createElement('section');s.className='section';var h=document.createElement('h2');h.textContent=g[1];s.appendChild(h);list.forEach(function(x){s.appendChild(card(x))});root.appendChild(s)});if(!root.children.length){var e=document.createElement('div');e.className='empty';e.textContent='还没有待办，等电脑那边收到新消息就会出现在这里';root.appendChild(e)}};
})();
</script></body></html>
