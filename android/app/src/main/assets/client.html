<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>群务台</title><style>
:root{color-scheme:light;--ink:#17231f;--muted:#53645d;--paper:#f4f5ef;--card:#fffefa;--line:#d8dfd6;--green:#245b45;--green-soft:#e6eee7;--amber:#70420c;--amber-bg:#f6ebd7;--red:#8b332b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45}.phone{max-width:390px;min-height:100vh;margin:auto;padding:env(safe-area-inset-top) 18px 82px}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 18px}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:13px;background:var(--green);display:grid;place-items:center;color:#fff}.brand strong{font-size:16px;letter-spacing:.02em}.brand small{display:block;color:var(--muted);font-size:12px}.icon-btn,.retry,.refresh{min-width:46px;min-height:46px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--green);display:grid;place-items:center}.hero{padding:16px 0 18px}.eyebrow{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.beta{display:inline-flex;align-items:center;min-height:28px;margin-left:7px;padding:3px 9px;border-radius:99px;background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:800;letter-spacing:.04em;vertical-align:middle}.hero h1{font-size:29px;line-height:1.13;letter-spacing:-.04em;margin:7px 0 8px}.hero p{margin:0;color:var(--muted);max-width:31ch}.offline{margin:0 0 16px;padding:12px 13px;border:1px solid #e6c99c;border-radius:15px;background:var(--amber-bg);color:var(--amber);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}.offline .relink{flex:none;min-height:36px;padding:0 12px;border:1px solid #d9b57e;border-radius:11px;background:#fff8ec;color:var(--amber);font-weight:700;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 18px}.stat{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:11px 12px}.stat b{display:block;font-size:21px;line-height:1.1}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 9px}.section-title h2{font-size:15px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.task{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 9px;box-shadow:0 12px 28px rgba(24,40,31,.08)}.task.urgent{border-color:#d7a47b;background:#fffaf2}.task-top{display:flex;gap:11px;align-items:flex-start}.check{width:22px;height:22px;flex:none;border:2px solid var(--green);border-radius:50%;margin-top:1px}.task-body{min-width:0}.task h3{font-size:16px;line-height:1.35;margin:0;font-weight:750}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;color:var(--muted);font-size:12px}.tag{padding:3px 7px;border-radius:7px;font-weight:700}.tag.late{background:#f7e6e2;color:var(--red)}.tag.soon{background:var(--green-soft);color:var(--green)}.group{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.empty{padding:28px 6px;text-align:center;color:var(--muted)}.empty h2{color:var(--ink);font-size:18px;margin:12px 0 5px}.empty p{margin:0 auto 16px;max-width:29ch}.retry{margin:0 auto;padding:0 18px;background:var(--green);color:#fff;border-color:var(--green);font-weight:700}.refresh{position:fixed;right:18px;bottom:18px;border:0;border-radius:50%;background:var(--green);color:#fff;box-shadow:0 8px 20px rgba(24,40,31,.2);font-size:22px}@media(max-width:340px){.phone{padding-left:14px;padding-right:14px}.hero h1{font-size:26px}.stat{padding-left:9px;padding-right:9px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body><main class="phone"><header class="top"><div class="brand"><div class="mark" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7.5h14M5 12h10M5 16.5h7"/><circle cx="18" cy="16" r="3"/></svg></div><div><strong>群务台</strong><small>把群里的事，安排明白</small></div></div><button class="icon-btn" aria-label="刷新" onclick="if(window.AndroidBridge&&AndroidBridge.refresh)AndroidBridge.refresh()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.8-2L20 9M4 15l2.6 2a7 7 0 0 0 11.8-2"/></svg></button></header><section class="hero"><div class="eyebrow" id="eyebrow">群务台 · 今日安排</div><h1 id="headline">加载中…</h1><p id="subline"></p></section><div id="offline"></div><section class="stats" aria-label="任务统计"><div class="stat"><b id="open">0</b><span>待处理</span></div><div class="stat"><b id="overdue">0</b><span>已逾期</span></div><div class="stat"><b id="done">0</b><span>已完成</span></div></section><div id="lists"></div><div id="empty" class="empty" hidden><h2 id="empty-title">暂时没有待办</h2><p id="empty-note">群务台会把 QQ 群里需要跟进的事整理到这里。</p><button class="retry" onclick="if(window.AndroidBridge&&AndroidBridge.refresh)AndroidBridge.refresh()">刷新</button></div></main><button class="refresh" aria-label="刷新" onclick="if(window.AndroidBridge&&AndroidBridge.refresh)AndroidBridge.refresh()">↻</button><script>
(function(){function arr(x){return Array.isArray(x)?x:[]}function text(x){return x==null?'':String(x)}function dateText(x){if(!x)return'';var d=new Date(x);if(isNaN(d.getTime()))return text(x);return(d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function card(t){var el=document.createElement('article');el.className='task'+(t.effective_urgent||(!('effective_urgent'in t)&&t.urgent)?' urgent':'');var top=document.createElement('div');top.className='task-top';var check=document.createElement('span');check.className='check';check.setAttribute('aria-label','未完成');top.appendChild(check);var body=document.createElement('div');body.className='task-body';var h=document.createElement('h3');h.textContent=text(t.summary)||'未命名任务';body.appendChild(h);var meta=document.createElement('div');meta.className='meta';if(t.deadline){var tag=document.createElement('span');tag.className='tag '+(new Date(t.deadline)<new Date()?'late':'soon');tag.textContent=dateText(t.deadline);meta.appendChild(tag)}if(arr(t.groups).length){var g=document.createElement('span');g.textContent=arr(t.groups).join('、');meta.appendChild(g)}body.appendChild(meta);top.appendChild(body);el.appendChild(top);if(t.details){var d=document.createElement('div');d.className='group';d.textContent=text(t.details);el.appendChild(d)}return el}window.NH_render=function(p){p=p||{};var t=p.tasks||{},m=p.meta||{},st=t.stats||m.stats||{};document.getElementById('headline').textContent=text(t.headline)||'今天没有到期的事';document.getElementById('subline').textContent=text(t.subline);document.getElementById('open').textContent=text(st.open)||'0';document.getElementById('overdue').textContent=text(st.overdue)||'0';document.getElementById('done').textContent=text(st.done)||'0';var beta=m.channel==='beta',ey=document.getElementById('eyebrow');ey.textContent='群务台 · 今日安排';var old=document.getElementById('beta');if(old)old.remove();if(beta){var badge=document.createElement('span');badge.id='beta';badge.className='beta';badge.textContent='BETA 测试版';ey.appendChild(badge)}var off=document.getElementById('offline');off.textContent='';if(p.offline===true){var b=document.createElement('div');b.className='offline';var om=document.createElement('span');om.textContent=p.authFailed===true?'配对已失效 · 需要重新配对':(p.stale===true?'离线 · 当前显示上次同步的数据':'连不上电脑');b.appendChild(om);if(window.AndroidBridge&&AndroidBridge.reconnect){var rp=document.createElement('button');rp.type='button';rp.className='relink';rp.textContent='重新配对';rp.onclick=function(){AndroidBridge.reconnect()};b.appendChild(rp)}off.appendChild(b)}var root=document.getElementById('lists');root.textContent='';document.getElementById('empty').hidden=true;var seen={};[['today','今天要做'],['pinned','置顶事项'],['week','本周处理'],['later','稍后处理']].forEach(function(group){var list=arr(t[group[0]]).filter(function(x){if(!x||x.id==null||seen[x.id])return false;seen[x.id]=true;return true});if(!list.length)return;var section=document.createElement('section');section.className='section';var title=document.createElement('div');title.className='section-title';var h=document.createElement('h2');h.textContent=group[1];title.appendChild(h);var count=document.createElement('span');count.textContent=list.length+' 项';title.appendChild(count);section.appendChild(title);list.forEach(function(x){section.appendChild(card(x))});root.appendChild(section)});if(!root.children.length){var empty=document.getElementById('empty');empty.hidden=false;var offEmpty=p.offline===true;document.getElementById('empty-title').textContent=offEmpty?'还没拿到任务':'暂时没有待办';document.getElementById('empty-note').textContent=offEmpty?(p.authFailed===true?'这台手机已经不被电脑认可（电脑重装、换过令牌或解绑过）。点上面的「重新配对」再连一次。':'现在连不上电脑上的群务台。确认手机和电脑在同一个网络、电脑上的群务台正在运行，然后点下面刷新。'):'群务台会把 QQ 群里需要跟进的事整理到这里；群里出现新的待办后会自动显示。'}}})();
</script></body></html>
