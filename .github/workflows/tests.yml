name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

  # 托盘真机冒烟（桌面无关的那一半）。
  # 为什么只跑 -NoUi：托盘图标与右键菜单要靠任务栏 UIA 和鼠标事件，GitHub 的 windows
  # runner 把作业跑在服务会话里，没有可读的任务栏，UIA 三段只会 exit 3 或变成假红。
  # 所以 CI 验的是「起得来、答得上、退得干净」：解包 → 起 launcher → /api/health 200
  # → --quit 退出码 0 → 无残留进程 → 日志无 traceback。真图标/菜单仍由本地
  # tools\tray-smoke.ps1（不带 -NoUi）按桌面条件跑。
  # packaging/*.zip 不进 git，所以这里先用 build.ps1 现场打一份；build.ps1 写死
  # .venv\Scripts\python.exe，故先建同名 venv（不改打包脚本，它同时被本地发版用）。
  tray-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create build venv
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build the installer zip
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Tray smoke (no UI)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\tray-smoke.ps1 -NoUi
          $code = $LASTEXITCODE
          Write-Output "EXIT=$code"
          exit $code

  # 浏览器级行为测试（Playwright + runner 预装 Edge）。
  # 不跑 playwright install：channel="msedge" 直接用预装 Edge 155，零浏览器下载。
  # 与 unittest job 并行；失败时上传 trace.zip 与截图。回滚 = 删本 job。
  browser:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run browser tests
        env:
          NH_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}\browser-artifacts
        run: python -m unittest tests.test_ui_browser -v

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: browser-artifacts/
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

  # CI 全绿是推 main 的硬标准（用户 2026-10-27 拍板）：
  # 每次推 main 后上面五个 job 必须全绿才算收工；红了 24 小时内根因修复，
  # 不许用 skip / 降级 / 改断言绕过（唯一例外是真平台限制，且要写清原因和将来怎么补）。
  # 这个 job 只做汇总判定：任何一个 job 失败 / 取消 / 跳过，它自己也红。
  # 把 ci-green 设成分支保护的必需检查，就能用一个名字代替盯五条。
  ci-green:
    if: always()
    needs: [unittest, linux, macos, tray-smoke, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::at least one job is not green ($RESULTS) - fix the root cause, do not skip"
              exit 1
            fi
          done
          echo "all five jobs green"
